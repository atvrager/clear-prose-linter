extends: substitution
message: "Omit needless words: use '%s' instead of '%s' (Strunk & White Principle 17)"
link: https://archive.org/details/pdfy-2_qp8jQ61OI6NHwa
level: warning
swap:
  "as to whether": "whether"
  "as yet": "yet"
  "being that": "because"
  "care less": "care"
  "each and every one": "each one"
  "in terms of": "in"
  "in the last analysis": "finally"
  "inside of": "inside"
  "one of the most": "a"
  "the foreseeable future": "soon"
  "try and": "try to"
  "there is no doubt that": "no doubt"
  "used for fuel purposes": "used for fuel"
  "he is a man who": "he"
  "in a hasty manner": "hastily"
  "the question as to whether": "whether"
  "owing to the fact that": "because"
  "in spite of the fact that": "though"
  "call your attention to the fact that": "remind you"
  "the fact that he had not succeeded": "his failure"
  "not honest": "dishonest"
  "did not remember": "forgot"
  "did not pay attention to": "ignored"
  "did not have much confidence in": "distrusted"
